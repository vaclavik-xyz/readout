name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-smoke:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift Toolchain
        run: swift --version

      - name: Build
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          swift build 2>&1 | tee .ci-logs/swift-build.log

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee .ci-logs/swift-test.log

      - name: Fixture Schema Validation
        run: |
          set -o pipefail
          swift run ReadOutFixtureTool validate-multimeter \
            --input Tests/ReadOutCoreTests/Fixtures/multimeter_fixtures.json \
            2>&1 | tee .ci-logs/fixture-validate-multimeter.log
          swift run ReadOutFixtureTool validate-usbc \
            --input Tests/ReadOutCoreTests/Fixtures/usbc_frame_fixtures.json \
            2>&1 | tee .ci-logs/fixture-validate-usbc.log

      - name: Parser Drift Guard
        run: |
          set -o pipefail
          mkdir -p .ci-baseline

          git fetch --no-tags --depth=1 origin main

          if git show origin/main:Tests/ReadOutCoreTests/Fixtures/multimeter_fixtures.json > .ci-baseline/multimeter_fixtures.json 2>/dev/null; then
            echo "Loaded baseline multimeter fixtures from origin/main."
          else
            cp Tests/ReadOutCoreTests/Fixtures/multimeter_fixtures.json .ci-baseline/multimeter_fixtures.json
            echo "Baseline multimeter fixtures fallback to current branch."
          fi

          if git show origin/main:Tests/ReadOutCoreTests/Fixtures/usbc_frame_fixtures.json > .ci-baseline/usbc_frame_fixtures.json 2>/dev/null; then
            echo "Loaded baseline USB-C fixtures from origin/main."
          else
            cp Tests/ReadOutCoreTests/Fixtures/usbc_frame_fixtures.json .ci-baseline/usbc_frame_fixtures.json
            echo "Baseline USB-C fixtures fallback to current branch."
          fi

          swift run ReadOutFixtureTool drift-report \
            --candidate-multimeter Tests/ReadOutCoreTests/Fixtures/multimeter_fixtures.json \
            --candidate-usbc Tests/ReadOutCoreTests/Fixtures/usbc_frame_fixtures.json \
            --baseline-multimeter .ci-baseline/multimeter_fixtures.json \
            --baseline-usbc .ci-baseline/usbc_frame_fixtures.json \
            --max-new-unknown-modes 0 \
            --max-new-overload-tokens 1 \
            --max-invalid-frame-ratio-delta 0.05 \
            --output .ci-logs/parser-drift-report.json \
            2>&1 | tee .ci-logs/parser-drift.log

      - name: Runtime Smoke (ReadOutSoak)
        run: |
          set -o pipefail
          swift run ReadOutSoak \
            --preset smoke \
            --seed 42 \
            --target-frames 400 \
            --timeout-seconds 40 \
            --output .ci-logs/soak-smoke-summary.json \
            2>&1 | tee .ci-logs/soak-smoke.log

      - name: App Startup Smoke (Headless)
        run: |
          set -o pipefail
          swift test --filter appStartupSmokeBootstrapsDashboardViewModel \
            2>&1 | tee .ci-logs/readout-macapp-smoke.log

      - name: Upload CI Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ci-logs-${{ github.run_id }}
          path: .ci-logs
          if-no-files-found: warn
